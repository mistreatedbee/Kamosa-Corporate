name: Post-Deploy Smoke Check

# Triggers on Vercel's GitHub deployment status updates — fires automatically after every real
# deployment (Vercel's GitHub integration posts these). This exists because of a real incident:
# every /api/* serverless function was FUNCTION_INVOCATION_FAILED in production for a period while
# CI (typecheck/lint/build) stayed green the whole time — a build succeeding says nothing about
# whether the deployed function actually runs. This is the gap-closer: it asserts real HTTP
# behavior against the live URL, not just that the build completed.

on:
  deployment_status:

jobs:
  smoke-check:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify the live deployment actually serves working pages and functions
        run: |
          set -e
          URL="${{ github.event.deployment_status.target_url }}"
          echo "Smoke-checking deployment at $URL"

          PUBLIC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$URL/")
          if [ "$PUBLIC_STATUS" != "200" ]; then
            echo "::error::Homepage returned HTTP $PUBLIC_STATUS, expected 200 — the deployed site is not serving pages."
            exit 1
          fi

          # api/admin/logout has zero external dependencies (no Supabase, no env-var-dependent
          # logic beyond setting a cookie) — the simplest possible canary for "do serverless
          # functions execute at all on this deployment." A 500 here means every function is
          # almost certainly broken, exactly as happened in the incident this workflow exists for.
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 20 -X POST "$URL/api/admin/logout")
          if [ "$API_STATUS" = "500" ]; then
            echo "::error::api/admin/logout returned HTTP 500 (FUNCTION_INVOCATION_FAILED or similar) on the live deployment — serverless functions are broken. This is the exact failure class that motivated this check."
            exit 1
          fi

          echo "OK: $URL is serving real responses from both the static site and a serverless function."
