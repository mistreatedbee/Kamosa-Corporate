name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx

      - name: Build
        run: npx vite build

      # Non-negotiable per docs/QA_TESTING_STRATEGY.md: the Supabase service-role key bypasses RLS
      # entirely, so a leak into the client bundle is equivalent to having no RLS at all — the direct
      # forward-looking equivalent of the original hardcoded-admin-password-in-the-bundle incident.
      # This step fails the build if any known secret-shaped pattern appears in dist/.
      - name: Verify no server-side secrets leaked into the client bundle
        run: |
          set -e
          FOUND=0
          # A real key has a long random suffix after the prefix. @supabase/supabase-js itself
          # (used client-side since the careers CV-upload feature) contains the bare literal
          # `"sb_secret_"` as a prefix-check string, which is not a leak — match the key SHAPE,
          # not the prefix alone, so that legitimate library code doesn't trip this.
          if grep -rE "sb_secret_[A-Za-z0-9_-]{20,}" dist/ 2>/dev/null; then
            echo "::error::Found a Supabase secret key (sb_secret_ prefix) in the client bundle!"
            FOUND=1
          fi
          if grep -r '"role":"service_role"' dist/ 2>/dev/null; then
            echo "::error::Found a service_role JWT claim in the client bundle!"
            FOUND=1
          fi
          if grep -rE "SUPABASE_SERVICE_ROLE_KEY|SUPABASE_DB_URL|SUPABASE_DB_POOLER_URL" dist/ 2>/dev/null; then
            echo "::error::Found a server-side-only env var name in the client bundle!"
            FOUND=1
          fi
          if [ "$FOUND" = "1" ]; then
            exit 1
          fi
          echo "OK: no server-side secret patterns found in dist/."

      # Per docs/SECURITY_ARCHITECTURE.md Finding 1.1 (the CTO's explicit condition for shipping
      # the admin inbox): every /api/admin/* data endpoint must call the session-auth guard before
      # doing anything else. login.ts and logout.ts are the auth boundary itself and are exempt —
      # every other file under api/admin/, AT ANY NESTING DEPTH (find, not a flat glob — the write
      # endpoints added for status/notes live under api/admin/enquiries/[id]/, which a flat
      # api/admin/*.ts glob would silently skip), must reference rejectIfUnauthorized, or this fails.
      - name: Verify every admin API endpoint enforces the session auth guard
        run: |
          set -e
          FAILED=0
          while IFS= read -r f; do
            base=$(basename "$f")
            if [ "$base" = "login.ts" ] || [ "$base" = "logout.ts" ]; then
              continue
            fi
            if ! grep -q "rejectIfUnauthorized" "$f"; then
              echo "::error file=$f::Admin endpoint does not call rejectIfUnauthorized — this is the exact class of gap that caused the original hardcoded-admin-auth incident."
              FAILED=1
            fi
          done < <(find api/admin -type f -name '*.ts')
          if [ "$FAILED" = "1" ]; then
            exit 1
          fi
          echo "OK: every admin data endpoint enforces the session auth guard."
