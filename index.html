<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamosa (Pty) Ltd | Health, Safety, Compliance & Business Solutions</title>
    <meta name="description" content="Kamosa (Pty) Ltd provides professional health, safety and compliance, business consulting, procurement and training solutions across South Africa." />

    <!--
      Static Open Graph/Twitter tags — required here, not only in Seo.tsx.
      Seo.tsx sets these dynamically via JavaScript after the app mounts, which works for real
      browsers but NOT for link-preview crawlers (WhatsApp, Facebook, Slack, etc.) — those fetch
      the raw HTML only and never execute JS, so without a static fallback here they see none of
      it and show a broken/empty preview. This is a fixed, site-wide fallback (not per-page);
      Seo.tsx's JS-driven per-page versions still override these for actual visitors' browser tabs.
      NOTE: og:url and og:image use the current live Vercel URL since the real domain isn't live
      yet — update both to https://www.kamosa.co.za once the domain is bought and pointed here.
      NOTE: logo2.png is 1734x907 (its actual dimensions) — if it's ever replaced, update
      og:image:width/height to match the new file's real size, not a guessed/ideal size.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kamosa (Pty) Ltd" />
    <meta property="og:title" content="Kamosa (Pty) Ltd | Health, Safety, Compliance & Business Solutions" />
    <meta property="og:description" content="Kamosa (Pty) Ltd provides professional health, safety and compliance, business consulting, procurement and training solutions across South Africa." />
    <meta property="og:url" content="https://kamosa-corporate.vercel.app/" />
    <meta property="og:image" content="https://kamosa-corporate.vercel.app/logo2.png" />
    <meta property="og:image:secure_url" content="https://kamosa-corporate.vercel.app/logo2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1734" />
    <meta property="og:image:height" content="907" />
    <meta property="og:image:alt" content="Kamosa (Pty) Ltd — Health, Safety, Compliance & Business Solutions" />
    <meta property="og:locale" content="en_ZA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kamosa (Pty) Ltd | Health, Safety, Compliance & Business Solutions" />
    <meta name="twitter:description" content="Kamosa (Pty) Ltd provides professional health, safety and compliance, business consulting, procurement and training solutions across South Africa." />
    <meta name="twitter:image" content="https://kamosa-corporate.vercel.app/logo2.png" />
    <meta name="twitter:image:alt" content="Kamosa (Pty) Ltd — Health, Safety, Compliance & Business Solutions" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
